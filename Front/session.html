<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vocalis voice input</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <section class="box" id="voice" aria-labelledby="h-v">
      <h2 id="h-v">Voice input</h2>
      <div class="voice">
        <button class="mic" id="mic" aria-label="Start recording" aria-pressed="false">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <canvas id="wave" aria-hidden="true"></canvas>
      </div>
      <div class="ctrl">
        <button class="btn ghost" id="pause" disabled>Pause</button>
        <button class="btn" id="submit" disabled>Submit</button>
      </div>
      <p class="status" id="status">Tap the microphone and speak.</p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/recorder.js"></script>
  <script>
    Vocalis.recorder.init({onStart: () => {}, onSubmit: () => {}});
  </script>
</body>
</html>
